name: fx_platforms
version: 1.0.0
environment:
  sdk: ^3.13.0
flutter:
  assets:
    - assets/all.txt
    - path: assets/android_only.txt
      platforms: [android]
    - path: assets/web_only.txt
      platforms: [web]
    - path: assets/ios_only.txt
      platforms: [ios]
    - path: assets/desktop/
      platforms: [linux, macos, windows]
