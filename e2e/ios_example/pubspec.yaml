name: ios_example
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 5.1.0
  flutter_qjs_next: 1.5.2
  libremidi_flutter: 0.9.0
  # An iOS plugin with a Package.swift and a podspec script phase.
  script_phase_plugin:
    path: path_packages/script_phase_plugin
  # An iOS plugin whose Swift package has a resource.
  resource_plugin:
    path: path_packages/resource_plugin
  video_player_avfoundation: 2.12.3
dev_dependencies:
  very_good_analysis: ^10.3.0
