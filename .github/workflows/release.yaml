# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  # Can be triggered from the tag.yaml workflow
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
      # What a push of a tag reads from the repository's secrets, in place of
      # publish_token; declared so the expression below type-checks.
      BCR_PUBLISH_TOKEN:
        required: false
  # Or, developers can manually push a tag from their clone
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
  actions: read # the release checks CI passed on the tagged commit
jobs:
  release:
    uses: aran/rules_dart/.github/workflows/overhead-release.yaml@5ca3547cfab16aaa6e5ebb2c4ac3f03ed3f4313e
    with:
      release_files: rules_flutter-*.tar.gz
      tag_name: ${{ inputs.tag_name || github.ref_name }}
  publish:
    needs: release
    uses: aran/rules_dart/.github/workflows/overhead-publish.yaml@5ca3547cfab16aaa6e5ebb2c4ac3f03ed3f4313e
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      attestations: write
      contents: write
      id-token: write
