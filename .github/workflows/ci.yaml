# CI workflow for rules_flutter
#
# Runs repo-root tests (Starlark unit tests, buildifier lint) and the e2e tests
# on every push/PR. Each e2e workspace runs on the operating systems where it
# exercises something no other job does; the `plan` job reads which, and why,
# from tools/ci_matrix/e2e_matrix.dart.
#
# No job checks out rules_dart: every workspace takes it as a registry
# `bazel_dep`. Local sibling overrides live in gitignored `.bazelrc.user` files,
# which never exist on a runner.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
# One repository cache per OS, set up by bazel-contrib/setup-bazel and shared
# by every Bazel job: downloads are content-addressed, so a workspace never
# needs its own copy.
#
# setup-bazel keys the repository cache by hashing files, by default the
# MODULE.bazel at `module-root`. Every job passes this same list instead, so
# they all land on one key per OS whichever workspace they build. A change to
# any of these files starts a new key, restored from the newest older one; the
# cache only grows that way, so bump `cache-version` to start it over.
#
# Only e2e hello_world saves it, on pushes to main. It builds for every
# platform and so fetches the most; were every job allowed to save, the first
# to finish (smoke, fetching almost nothing) would take the key and the rest
# could not replace it. Every other job, and every pull request, only restores,
# then downloads whatever its own workspace needs beyond that.
env:
  BAZEL_REPOSITORY_CACHE_KEY_FILES: |
    - MODULE.bazel
    - MODULE.bazel.lock
    - e2e/*/MODULE.bazel
    - e2e/_overlay_tests/*/MODULE.bazel
    - flutter/private/versions.bzl
jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: bazel test //...
        run: bazel test //... --test_output=errors
  # The hooks in .pre-commit-config.yaml, over every file. Nothing else runs
  # them for a commit made without `prek install`.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: j178/prek-action@v3.0.1
        with:
          # Keep in step with prek in multitool.lock.json
          prek-version: 0.5.5
  dart-tool-tests:
    name: Dart tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Run dev_tool tests
        working-directory: tools/dev_tool
        # Exclude e2e tests (tagged @Tags(['e2e'])): they need a browser/CDP,
        # iOS simulators, or a running macOS app — none available on this
        # runner. Real-render coverage lives in the Bazel e2e workspaces and,
        # for web, in the `web-smoke` job below.
        #
        # `runfiles` is excluded for a different reason: those tests read
        # fixtures declared in a Bazel target's `data` and resolve them through
        # the runfiles tree, which exists under `bazel test` and not here. They
        # are covered by their Bazel targets, which this job does not replace.
        run: dart test -x e2e -x runfiles
      # `-x runfiles` for the same reason as the dev_tool step above: these
      # tools are Bazel scripts, and one of them imports a package that arrives
      # through its `dart_test` deps rather than through this pubspec. Excluded
      # here, covered by //flutter/private/tools:flutter_test_runner_test.
      - name: Run private tool tests
        working-directory: flutter/private/tools
        run: dart pub get && dart test -x runfiles
  # The only place CI runs a browser against a web app — web_example's e2e jobs
  # below only build it and read the bytes — and the only place CI runs the
  # binary users install rather than `dart run`.
  # One `-c dbg` Chrome run, asserted down to a VM service that answers
  # `getVersion` — `app.started` alone does not prove DWDS came up.
  web-smoke:
    name: Web smoke (DWDS VM service)
    runs-on: ubuntu-latest
    # Cold, this downloads the Flutter SDK, the engine artifacts and the web
    # SDK, then AOT-compiles the dev tool before the run itself starts.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      # setup-bazel pins every workspace to one output base with a `startup`
      # line in ~/.bazelrc. This job runs two workspaces: the root, whose
      # bazel-bin holds the dev tool binary under test, and e2e/web_example,
      # which that binary builds. Sharing a base, the second would restart the
      # server and replace the execroot the running binary lives in. Drop the
      # line so each workspace keeps Bazel's own per-workspace default.
      - name: Keep one output base per workspace
        run: sed -i '/^startup --output_base=/d' ~/.bazelrc
      # The test process itself resolves this package's pubspec, and dwds
      # requires a Dart newer than the runner's default. The tool under test
      # runs on the hermetic Flutter toolchain either way.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks Chrome's sandbox from creating the user namespace it needs, and
      # Chrome then never announces a DevTools debugging port. Relax the sysctl
      # rather than passing --no-sandbox: this job exists to prove a real Chrome
      # run works, which a weakened browser would not establish.
      - name: Allow Chrome's sandbox to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # google-chrome is preinstalled on this runner and is on PATH, which is
      # exactly how the dev tool resolves it on Linux (host_tools.dart) — no
      # CHROME_EXECUTABLE needed. xvfb gives that Chrome a display.
      #
      # Run through tool/e2e.dart rather than `dart test` directly: `dart test`
      # exits 0 when every selected test skipped, so a skip gate would take this
      # job green having executed nothing. The runner reads the JSON result
      # stream and fails unless a verdict was reached, nothing failed, and at
      # least one test ran. It supplies `--tags=e2e` and `--concurrency=1`
      # itself and resolves tools/dev_tool from its own location.
      - name: Web smoke
        run: xvfb-run -a dart run tools/dev_tool/tool/e2e.dart test/e2e/web_smoke_e2e_test.dart
  # The jobs of `e2e` below: one per workspace and operating system, from the
  # table in tools/ci_matrix/e2e_matrix.dart. The same run checks that the table
  # lists every workspace under e2e/ and says, for each system, what the
  # workspace exercises there that no other job does or why it does not run, so
  # a workspace added without a decision fails here and not silently never runs,
  # and a job that repeats another's coverage has no purpose to give.
  plan:
    name: Plan E2E jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Build the E2E matrix
        id: matrix
        run: dart run tools/ci_matrix/ci_matrix.dart >> "$GITHUB_OUTPUT"
  e2e:
    name: E2E (${{ matrix.workspace }}, ${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # Cold, a workspace fetches its own Flutter SDK, engine and toolchains.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # See the note above `env` for why only hello_world saves.
      #
      # On Windows the output base is `<workspace drive>/b`, as short as a
      # directory can be, because aapt2 cannot open a path of 260 characters or
      # more, with long paths enabled or not (it is not long-path aware), and an
      # Android build reads resources from
      # `<output base>/execroot/_main/bazel-out/<config>/bin/external/<repo>/_aar/
      # unzipped/resources/...`. plugin_example's longest is 233 characters below
      # the execution root, so the execution root may take 26: `D:/b` leaves 6
      # to spare, setup-bazel's default `D:/_bazel` leaves 1, and a longer
      # artifact name on a bump would fail. The same short root
      # keeps nested runfiles, such as the hermetic Python interpreter's
      # `_socket.pyd`, under MAX_PATH. `--output_user_root` on the command line
      # cannot do this: setup-bazel's `startup --output_base` line in
      # `~/.bazelrc` beats it. tools/ci_matrix/test/windows_paths_test.dart
      # checks the arithmetic.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          output-base: ${{ runner.os == 'Windows' && format('{0}/b', substr(github.workspace, 0, 2)) || '' }}
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' && matrix.workspace == 'hello_world' }}
      - name: Install GTK3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      # GitHub's windows-latest image exports ANDROID_NDK_HOME with backslashes
      # (C:\Android\...), but rules_android_ndk's _create_symlinks() strips the
      # NDK prefix with a forward-slash string match against ctx.path() output,
      # so a backslashed value makes the symlink target escape the repo dir and
      # the fetch fails. Hand it a forward-slash path, as upstream's own Windows
      # CI does. See https://github.com/bazelbuild/rules_android_ndk/pull/108
      - name: Normalize ANDROID_NDK_HOME to forward slashes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ndk = $env:ANDROID_NDK_HOME ?? $env:ANDROID_NDK_ROOT
          "ANDROID_NDK_HOME=$($ndk -replace '\\','/')" >> $env:GITHUB_ENV
      # The workspace's MODULE.bazel.lock, checked before the build. Its
      # `.bazelrc` already builds with --lockfile_mode=error, which refuses a
      # lock that lacks an entry the build needs; `bazel mod deps` also catches
      # an entry that has gone stale, which a build never reads. A runner has no
      # `.bazelrc.user` to switch the check off. See docs/TESTING.md, "Lock
      # files".
      - name: bazel mod deps (e2e/${{ matrix.workspace }})
        if: runner.os != 'Windows'
        working-directory: e2e/${{ matrix.workspace }}
        run: bazel mod deps --lockfile_mode=error
      # --test_output=errors so a failure's assertion reaches this log. Without
      # it the output stays in a test.log on the runner and is discarded with
      # the machine. `build` takes no test flags: the workspaces that run it
      # have no test targets (see tools/ci_matrix/e2e_matrix.dart).
      - name: bazel ${{ matrix.command }} //... (e2e/${{ matrix.workspace }})
        if: runner.os != 'Windows'
        working-directory: e2e/${{ matrix.workspace }}
        run: bazel ${{ matrix.command }} //... ${{ matrix.command == 'test' && '--test_output=errors' || '' }}
      # On Windows the same lock check runs, then the tests, in the short output
      # base the setup step names, so both use one Bazel server. Without it,
      # nested runfiles (e.g. the hermetic Python interpreter's _socket.pyd
      # used by rules_android's aar_embedded_jars_extractor) exceed the 260-char
      # MAX_PATH limit and fail to load with "DLL load failed ... The filename or
      # extension is too long".
      - name: bazel mod deps (e2e/${{ matrix.workspace }})
        if: runner.os == 'Windows'
        working-directory: e2e/${{ matrix.workspace }}
        run: bazel mod deps --lockfile_mode=error
      - name: bazel test //... (e2e/${{ matrix.workspace }})
        if: runner.os == 'Windows'
        working-directory: e2e/${{ matrix.workspace }}
        run: bazel test //... --test_output=errors
