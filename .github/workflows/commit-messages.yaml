# Checks every commit pushed to main against the commit policy in AGENTS.md:
# a conventional-commit subject, and a `Changelog:` trailer on user-visible
# commits. Changes land on main directly, so this runs on push rather than on
# pull requests.
name: Commit messages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Restores the repository cache ci.yaml saves; the key files must match
      # its BAZEL_REPOSITORY_CACHE_KEY_FILES.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - e2e/*/MODULE.bazel
            - flutter/private/versions.bzl
          cache-save: false
      - name: Check the pushed commits
        run: bazel run //tools/changelog:check -- --range "${{ github.event.before }}..${{ github.sha }}"
