# Publishes a release to the Bazel Central Registry again, should the run
# release.yaml started have failed: dispatch it from the GitHub UI with the tag.
name: Publish to BCR
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string
jobs:
  publish:
    uses: aran/rules_dart/.github/workflows/overhead-publish.yaml@5ca3547cfab16aaa6e5ebb2c4ac3f03ed3f4313e
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      attestations: write
      contents: write
      id-token: write
