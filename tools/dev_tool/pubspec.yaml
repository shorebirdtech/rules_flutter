name: flutter_bazel_dev_tool
description: Dev tool for Bazel-built Flutter projects.
version: 0.1.0

environment:
  # The SDK this repo pins, as every pubspec here states. pub derives the
  # package's language version from it, and so does the build: its targets
  # state none, so they are compiled, analyzed and formatted at the SDK's
  # newest, which this matches. A lower floor misreports what the package
  # needs — `^3.0.0` once silently disabled field promotion for every
  # `final T? _x` here.
  sdk: ^3.13.0

resolution: workspace

dependencies:
  args: ^2.4.0
  clock: ^1.1.1
  dds: ^5.4.0
  # Exactly this release: dwds 27.1.4 never answers the `$dartHotRestartBeginDwds`
  # request, so a hot restart of a web app hangs (`agent_e2e_test.dart`, web).
  dwds: 27.1.1
  # The host half of the `RemoteListener` protocol, shared with the
  # `flutter_test` runner. Bazel builds take it from `//flutter/private/tools:remote_suite`;
  # this is how `dart test` finds it.
  flutter_rule_tools:
    path: ../../flutter/private/tools
  http_multi_server: ^3.2.1
  logging: ^1.2.0
  multicast_dns: ^0.3.2
  package_config: ^2.1.0
  path: ^1.9.0
  pool: ^1.5.0
  # Whether a macOS desktop session can show an integration test's window. Bazel
  # builds take it from `//tools/macos_gui_session`; this is how `dart test`
  # finds it.
  rules_flutter_macos_gui_session:
    path: ../macos_gui_session
  runfiles: ^0.4.3
  shelf: ^1.4.0
  vm_service: ^15.2.0
  watcher: ^1.1.0
  webkit_inspection_protocol: ^1.2.1

dev_dependencies:
  fake_async: ^1.3.1
  # Through `test`. 3.x starts the frontend server as `dart <snapshot>`, which
  # Dart 3.13 no longer runs; 4.0 starts its AOT snapshot.
  frontend_server_client: ^4.0.0
  # The macOS session probe the e2e tests share with the e2e workspaces. Bazel
  # builds take it from `//tools/e2e_testing`; this is how `dart test` finds it.
  rules_flutter_e2e_testing:
    path: ../e2e_testing
  test: ^1.25.0
